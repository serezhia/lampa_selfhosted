services:
  nginx:
    image: nginx:alpine
    container_name: lampa-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/certs/letsencrypt:/etc/letsencrypt
      - ./data/certs/acme-challenge:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - lampa-frontend
      - lampa-server
      - torrserver
      - jacred

  certbot:
    image: certbot/certbot
    container_name: lampa-certbot
    volumes:
      - ./data/certs/letsencrypt:/etc/letsencrypt
      - ./data/certs/acme-challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  lampa-frontend:
    image: lampa-frontend:local
    build:
      context: ./source/web
      dockerfile: Dockerfile
      args:
        - DOMAIN=${DOMAIN}
    container_name: lampa-frontend
    restart: unless-stopped
    volumes:
      # Builtin plugins from source (git-tracked)
      - ./source/web/custom_plugins:/plugins/builtin:ro
      # Custom user plugins (override builtin by same filename)
      - ./data/plugins:/plugins/custom:ro

  lampa-server:
    image: lampa-server:local
    build:
      context: ./source/server
      dockerfile: Dockerfile
    container_name: lampa-server
    restart: unless-stopped
    volumes:
      - ./data/database:/app/data
      - ./data/transcoding:/app/transcoding
    environment:
      - PORT=8080
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_NAME=${TELEGRAM_BOT_NAME:-@error_bot}
      - TELEGRAM_ADMIN_PHONES=${TELEGRAM_ADMIN_PHONES}
      - BASE_URL=${BASE_URL:-http://localhost}
      - TRANSCODING_DIR=/app/transcoding
      - JACRED_HOST=jacred
      - JACRED_PORT=9117
      - JACRED_API_KEY=${JACRED_API_KEY}

  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: lampa-torrserver
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data/torrserver/config:/opt/ts/config
      - ./data/torrserver/cache:/opt/ts/cache
    environment:
      - TS_PORT=8090
      - TS_DONTKILL=1
      - TS_HTTPAUTH=false

  jacred:
    image: ghcr.io/pavelpikta/jacred-fdb:latest
    container_name: lampa-jacred
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - UMASK=0027
    volumes:
      - ./data/jacred/config:/app/config
      - ./data/jacred/data:/app/Data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9117/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2048M
